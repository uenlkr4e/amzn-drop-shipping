packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# pnpm blocks dependency install scripts by default; these need theirs (native binaries).
allowBuilds:
  "@swc/core": true
  esbuild: true
  # Telemetry postinstall (via swagger-ui-dist) — not needed.
  "@scarf/scarf": false
  # Optional native msgpack accelerator for bullmq; the pure-JS fallback is fine.
  msgpackr-extract: false
